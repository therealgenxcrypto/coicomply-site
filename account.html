<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account | COIComply</title>
  <meta name="description" content="Manage your COIComply account.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg?v=compact" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260907-compact-logo">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="protected.js"></script>
</head>
<body data-protected="true">
  <header class="site-header">
    <nav class="nav container">
      <a class="brand" href="index.html"><img class="brand-logo" src="assets/coicomply-compact.png" alt="coi comply" width="180" height="44"></a>
      <div class="nav-actions">
        <a class="nav-cta" href="upload.html">Upload documents</a>
        <button class="nav-cta nav-logout" id="logoutButton" type="button">Log out</button>
      </div>
    </nav>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-heading">
        <p class="eyebrow">Account</p>
        <h2>Your COIComply account</h2>
        <p id="accountEmail">Loading account...</p>
      </div>
      <div class="output-grid">
        <article class="feature-card"><span class="feature-icon">01</span><h3>Initial uploads received</h3><p id="trialUsed">0</p></article>
        <article class="feature-card"><span class="feature-icon">02</span><h3>Initial uploads remaining</h3><p id="trialRemaining">10</p></article>
        <article class="feature-card"><span class="feature-icon">03</span><h3>Files uploaded</h3><p id="filesUploaded">0</p></article>
        <article class="feature-card"><span class="feature-icon">04</span><h3>Next step</h3><p><a href="upload.html">Upload COIs</a> to continue your membership onboarding.</p></article>
      </div>
    </div>
  </main>
  <script src="account.js" defer></script>
</body>
</html>
